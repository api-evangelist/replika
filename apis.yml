name: Replika
description: >-
  Replika is an AI companion mobile and web application built by Luka, Inc. that
  lets people create a personalized conversational AI "friend" for chat, emotional
  support, roleplay, voice calls, and augmented-reality companionship. The product
  is a closed consumer experience delivered through iOS, Android, and a legacy web
  app; it retains conversational memory and adapts its personality over time.
  Replika does not publish a public developer API, SDKs, OpenAPI/AsyncAPI
  specifications, webhooks, or an MCP server — all model behavior is applied
  server-side and surfaced only through the first-party apps. This API Evangelist
  profile therefore captures identity, legal, support, and domain-security signals
  rather than an API contract. Replika was surfaced as a Y Combinator portfolio
  company and enriched here as a company profile.
